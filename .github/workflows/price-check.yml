name: Hourly price check

on:
  schedule:
    # Every hour at :05 (UTC). GitHub may delay a few minutes.
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch price and update chart
        run: python run_check.py

      - name: Commit price history
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "price-tracker@users.noreply.github.com"
          git add data/prices.db data/prices.csv data/price_chart.png data/price_chart.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "price check $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Publish chart to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          publish_branch: gh-pages
          force_orphan: false
          keep_files: true
